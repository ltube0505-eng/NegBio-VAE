# ===============================
# Dataset configuration
# ===============================
dataset:
  name:  # #CIFAR16 MNIST pass from argument
# ===============================
# Model configuration
# ===============================
model:
  name: "negbio"              # or "poisson" "negbio" "categorical","laplace"
  latent_dim: 256             # dimension of latent variable z
  reparam_type: "gumbel"      # "gumbel" or "gamma" - only useful for Negbio-VAE
  max_count: 5                # only useful for Negbio-VAE with gumbel
  tau: 1.0                    # temperature
  kl: "analytical"            # mc or analytical
  latent_act: "sigmoid"       
  num_samples: 5        
# ===============================
# Encoder configuration
# ===============================
encoder:
  type: "conv"                # or "linear" "conv" "mlp"
  input_dim:                # only needed for linear encoder
    MNIST: 784
    CIFAR16: 768
    Omniglot: 28
    SVHN: 768
  latent_dim: 256
  use_norm: true
  bias: true
  activation_fn: "swish"         #{'swish', 'elu', 'relu', 'leaky_relu'}
  use_bn: false
  use_se: true
  res_eps: 1.0
  enc_norm: true
  enc_bias: true
# ===============================
# Decoder configuration
# ===============================
decoder:
  type: "conv"                # or "linear" "conv" "mlp"
  output_dim: 784            # only needed for linear decoder
  latent_dim: 256
  out_channel:                # only needed for conv decoder
    MNIST: 1
    CIFAR16: 3
    Omniglot: 1
    SVHN: 3
  size:
    MNIST: 7
    CIFAR16: 4
    Omniglot: 7
    SVHN: 4
# ===============================
# Optimizer configuration
# ===============================
optimizer:
  name: "adam"                # or "sgd"
  lr: 0.001                  # learning rate
  weight_decay: 0.0           # optional
# ===============================
# Trainer settings
# ===============================
trainer:
  beta_max: 1.0               # max beta for KL scheduling
  schedule_epochs: 300        # warm-up schedule for beta
  max_epochs: 100             # total training epochs
  gpus: 1                     # number of GPUs to use

# ===============================
# Logging / checkpointing (optional)
# ===============================

eval:
  fid_feature: 64
  log_images: true



logging:
  use_wandb: False
  wandb_project: "vae-experiments"
  log_images: true
  save_checkpoints: true
  monitor: "val_fid"
  save_files: false